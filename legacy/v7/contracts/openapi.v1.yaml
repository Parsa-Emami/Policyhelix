openapi: 3.2.0
info:
  title: PolicyHelix API
  version: 1.0.0
  description: Canonical implementation-start HTTP contract. Source code must conform to this contract; changes require compatibility review.
servers:
- url: /api/v1
tags:
- name: PolicyHelix
security:
- bearerAuth: []
paths:
  /applications:
    post:
      summary: Register protected application
      operationId: policyhelix_post_applications
      tags:
      - PolicyHelix
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 4096
                audience:
                  type: string
                  minLength: 1
                  maxLength: 4096
                upstreams:
                  type:
                  - object
                  - array
              required:
              - name
              - audience
              - upstreams
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
  /policies:
    post:
      summary: Create immutable policy revision
      operationId: policyhelix_post_policies
      tags:
      - PolicyHelix
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                application_id:
                  type: string
                  minLength: 1
                  maxLength: 4096
                rego:
                  type: string
                  minLength: 1
                  writeOnly: true
                data:
                  type:
                  - object
                  - array
              required:
              - application_id
              - rego
              - data
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
  /bundles/publish:
    post:
      summary: Compile, sign and publish OPA bundle
      operationId: policyhelix_post_bundles_publish
      tags:
      - PolicyHelix
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                policy_revision_ids:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
                key_id:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
              - policy_revision_ids
              - key_id
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
  /simulator/decide:
    post:
      summary: Simulate authorization decision
      operationId: policyhelix_post_simulator_decide
      tags:
      - PolicyHelix
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                subject:
                  type:
                  - object
                  - array
                action:
                  type: string
                  minLength: 1
                  maxLength: 4096
                resource:
                  type:
                  - object
                  - array
                context:
                  type:
                  - object
                  - array
              required:
              - subject
              - action
              - resource
              - context
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
  /sessions/{id}/revoke:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Opaque resource identifier.
    post:
      summary: Revoke session
      operationId: policyhelix_post_sessions_id_revoke
      tags:
      - PolicyHelix
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
              - reason
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
  /gateways:
    get:
      summary: Read gateway applied bundle state
      operationId: policyhelix_get_gateways
      tags:
      - PolicyHelix
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/RequestId'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque/OIDC-access-token
    mutualTLS:
      type: mutualTLS
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Unique command key. Same key + same principal + same semantic request must replay the original result.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    OperationResult:
      type: object
      additionalProperties: false
      required:
      - request_id
      - status
      properties:
        request_id:
          type: string
        operation_id:
          type:
          - string
          - 'null'
        resource_id:
          type:
          - string
          - 'null'
        version:
          type:
          - integer
          - 'null'
          minimum: 0
        status:
          type: string
        data:
          type:
          - object
          - array
          - string
          - number
          - boolean
          - 'null'
    ApiError:
      type: object
      additionalProperties: false
      required:
      - request_id
      - code
      - message
      properties:
        request_id:
          type: string
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
        message:
          type: string
        retryable:
          type: boolean
        details:
          type:
          - object
          - array
          - 'null'
  responses:
    ErrorResponse:
      description: Stable API error envelope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
